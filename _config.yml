# Site settings
title:          Boz's Blog
description:    "My personal blog for sharing my thoughts and experiences"
url:            "https://guobaozhi.github.io"

# Google Analytics
google_analytics: UA—XXXXXXXX-X

# Author
author:
  name:         Boz
  url:          https://gridframe.cn
  email:        guobaozhi@gmail.com
  # linkedin:     guobaozhi@gmail.com

# Build settings
markdown:       kramdown
include:
  - _pages

collections:
  thoughts:
    output: true
    permalink: /thoughts/:name/
# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-toc
  # - jemoji #Uncomment this to allow emoji in your post

# TOC Settings
toc:
  min_level: 1
  max_level: 3
  list_class: toc
  list_class: toc__list
  sublist_class: toc__sublist

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       10

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

# Disqus (Set to your disqus id)
disqus:         jekyll-tale